name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # No GPU and no network access to SEC. Tests marked gpu or network are excluded,
    # which is possible because the stub backend drives the whole pipeline on CPU.
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check
        run: mypy src/silentwall

      - name: Test
        run: pytest -m "not network and not gpu and not slow" --cov=silentwall --cov-report=term-missing

      - name: Smoke pipeline
        run: silentwall sweep --config configs/smoke.yaml --quiet
