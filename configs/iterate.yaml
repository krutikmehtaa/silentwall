# Iteration profile. Real model, small, fits free Colab or a local 8GB card.
# Use this to sanity check behaviour on actual generations before committing
# free-tier GPU hours to the default profile.

profile: iterate
tier: gpu-1p5b

corpus:
  synthetic: true
  synthetic_seed: 11
  target_restricted: 20
  control_ratio: 1.0
  sic_match_digits: 2

sampling:
  k: 8
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_new_tokens: 96
  base_seed: 20260101
  topm_logprobs: 5

split:
  split_seed: 991
  dev_fraction: 0.5

stats:
  bootstrap_resamples: 2000
  cv_folds: 5
  cv_repeats: 5
  permutation_draws: 500
  fdr_q: 0.10
  ci_level: 0.95
  undetectable_threshold: 0.60
  leak_curve_k: [1, 2, 4, 8]

methods:
  - clean_reference
  - none
  - system_prompt
  - retrieval_filter
  - refusal_classifier
  - silentwall

cache_layers:
  - cache/iterate

artifacts_dir: artifacts/iterate
data_dir: data/iterate
logs_dir: logs/iterate

max_generations: 40000
behavioural_templates: 8
content_probes_per_family: 3
template_pack_version: tp1
