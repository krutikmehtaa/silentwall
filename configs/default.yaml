# Default profile. This is what produces the reported numbers.
#
# Target: Kaggle free tier, 16GB P100 or T4, 7B model in 4-bit NF4.
# Sizing: 60 restricted plus 60 matched controls at k=16 is roughly 28,800
# generations per method, about 1.5 to 2.5 GPU-hours, so one method fits one
# session. A full sweep spans sessions and relies on the cache being carried
# forward, which is what cache_layers is for.
#
# Before a real run, set corpus.synthetic to false and fill in corpus.user_agent.
# SEC asks automated clients for a descriptive string with a contact address.

profile: default
tier: gpu-8b-nf4

corpus:
  # flip to false for the live EDGAR corpus
  synthetic: true
  synthetic_seed: 20260101
  target_restricted: 60
  control_ratio: 1.0
  size_metric: Revenues
  sic_match_digits: 2
  # required when synthetic is false, for example:
  # user_agent: "SilentWall research you@example.com"
  user_agent: ""
  quarters: ["2019Q1", "2019Q2", "2019Q3", "2019Q4"]
  form_types: ["8-K"]
  max_fetch_failure_rate: 0.25

sampling:
  k: 16
  temperature: 0.7
  top_p: 0.95
  top_k: 50
  max_new_tokens: 128
  base_seed: 20260101
  topm_logprobs: 5

split:
  split_seed: 991
  # 0.3 rather than an even split. The split decides which entities the headline
  # detector reports on, and it does not change what gets generated, so shifting
  # entities from dev to eval buys statistical power at exactly zero compute cost.
  #
  # At 60 pairs: 0.5 leaves 30 eval pairs, SE 0.075, resolving 0.5 against 0.65.
  # 0.3 leaves 42 eval pairs, SE 0.063, resolving 0.5 against 0.62. Returns flatten
  # past this point, and 18 dev pairs is ample for a four-parameter calibration
  # measured over aggregate statistics.
  dev_fraction: 0.3

stats:
  bootstrap_resamples: 10000
  cv_folds: 5
  cv_repeats: 10
  permutation_draws: 2000
  fdr_q: 0.10
  ci_level: 0.95
  undetectable_threshold: 0.60
  leak_curve_k: [1, 2, 4, 8, 16]

methods:
  - clean_reference
  - none
  - system_prompt
  - retrieval_filter
  - refusal_classifier
  - lora_ga
  - silentwall

# Earlier layers are read only, the last is the writable overlay. On Kaggle,
# point the earlier entries at mounted output datasets from previous sessions.
cache_layers:
  - cache/default

artifacts_dir: artifacts/default
data_dir: data/default
logs_dir: logs/default

# Ceiling per method. Exceeding it needs an explicit confirmation flag, which is
# what stops a session from silently eating the weekly quota.
max_generations: 30000
behavioural_templates: 8
content_probes_per_family: 3
template_pack_version: tp1
